<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f4f9">

<!-- Simple Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Book Finder</a>
    <div>
      <a class="nav-link text-white" href="about.html">About</a>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
  <h2 class="text-center mb-4">Search for a Book</h2>

  <div class="input-group mb-4">
    <input id="searchInput" type="text" class="form-control" placeholder="Type a book title...">
    <button class="btn btn-primary" onclick="searchBooks()">Search</button>

  <p class="text-muted">
    This page uses the public Open Library API to look up books by title.

  </p>

  <div id="results" class="row"></div>
</div>

<script src="index.js"></script>
