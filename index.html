<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFinder - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-cover { height: 180px; object-fit: cover; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">📚 BookFinder</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Book Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">My Library</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Welcome to BookFinder</h1>
                <p class="col-md-8 fs-4">
                    Your simple source for discovering new reads using the powerful Open Library API. Start your search or check out our new book suggestions below!
                </p>
                <a href="search.html" class="btn btn-primary btn-lg">Start Browsing</a>
            </div>
        </div>

        <h2 class="mb-4">🔥 New Book Suggestions</h2>
        <div class="row row-cols-1 row-cols-md-4 g-4" id="suggestions-container">
            <p id="loading-message">Loading new books...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        // Start the process for the home page
        document.addEventListener('DOMContentLoaded', fetchNewBookSuggestions);
    </script>
</body>
</html>
