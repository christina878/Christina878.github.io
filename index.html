<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body onload="loadDetails()">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Book App</a>
    <div>
      <a class="nav-link d-inline text-white" href="index.html">Home</a>
      <a class="nav-link d-inline text-white" href="books.html">Books</a>
      <a class="nav-link d-inline text-white" href="profile.html">Profile</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <h1>Book Details</h1>

  <div id="detailsBox" class="mt-4"></div>

</div>

<script>
function loadDetails() {
  const params = new URLSearchParams(window.location.search);

  const title = params.get("title");
  const author = params.get("author");
  const year = params.get("year");
  const cover = params.get("cover");
  const workKey = params.get("work"); // e.g. /works/OL45883W

  const box = document.getElementById("detailsBox");

  // Start with basic info
  box.innerHTML = `
    <div class="card p-4">
      <img src="${cover}" class="img-fluid mb-3" style="max-width:250px">
      <h3>${title}</h3>
      <p><strong>Author:</strong> ${author}</p>
      <p><strong>First Published:</strong> ${year}</p>
      <hr>
      <h5>Summary</h5>
      <p id="summary">Loading...</p>

      <h5 class="mt-3">Categories</h5>
      <p id="categories">Loading...</p>

      <a href="books.html" class="btn btn-secondary mt-3">Back to Search</a>
    </div>
  `;

  // Fetch details from Open Library Works API
  fetch("https://openlibrary.org" + workKey + ".json")
    .then(r => r.json())
    .then(data => {
      // SUMMARY
      let summaryText = "No summary available.";
      if (data.description) {
        // description can be a string or an object { value: "..." }
        summaryText = typeof data.description === "string"
          ? data.description
          : data.description.value;
      }

      document.getElementById("summary").innerHTML = summaryText;

      // SUBJECTS (genres/categories)
      let subjects = data.subjects || [];
      let categories = subjects.length > 0
        ? subjects.slice(0, 8).join(", ")   // limit to 8 subjects
        : "No categories available.";

      document.getElementById("categories").innerHTML = categories;
    })
    .catch(() => {
      document.getElementById("summary").innerHTML = "Summary unavailable.";
      document.getElementById("categories").innerHTML = "Categories unavailable.";
    });
}
</script>

</body>
</html>
