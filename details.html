<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body onload="loadDetails()">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Book App</a>
    <div>
      <a class="nav-link d-inline text-white" href="index.html">Home</a>
      <a class="nav-link d-inline text-white" href="books.html">Books</a>
      <a class="nav-link d-inline text-white" href="profile.html">Profile</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <h1>Book Details</h1>

  <div id="detailsBox" class="mt-4"></div>

</div>

<script>
function loadDetails() {
  const params = new URLSearchParams(window.location.search);

  const title = params.get("title");
  const author = params.get("author");
  const year = params.get("year");
  const cover = params.get("cover");
  const workKey = params.get("work"); // "/works/OL45883W"

  const box = document.getElementById("detailsBox");

  box.innerHTML = `
    <div class="card p-4">
      <img src="${cover}" class="img-fluid mb-3" style="max-width:250px">
      <h3>${title}</h3>
      <p><strong>Author:</strong> ${author}</p>
      <p><strong>First Published:</strong> ${year}</p>
      <hr>

      <h5>Summary</h5>
      <p id="summary">Loading summary...</p>

      <h5 class="mt-3">Book Type</h5>
      <p id="bookType">Loading type...</p>

      <a href="books.html" class="btn btn-secondary mt-3">Back</a>
    </div>
  `;

  // Fetch extra details from the Works API
  fetch("https://openlibrary.org" + workKey + ".json")
    .then(r => r.json())
    .then(data => {
      
      // SUMMARY
      let summaryText = "No summary available.";
      if (data.description) {
        if (typeof data.description === "string") summaryText = data.description;
        else if (data.description.value) summaryText = data.description.value;
      }
      document.getElementById("summary").innerHTML = summaryText;

      // SUBJECTS (genres)
      let subjects = data.subjects || [];
      
      let type = "Unknown";
      let s = subjects.join(" ").toLowerCase();

      if (s.includes("romance")) type = "Romantic";
      else if (s.includes("fantasy")) type = "Fantasy";
      else if (s.includes("love")) type = "Romantic";
      else if (s.includes("growth") || s.includes("self-help")) type = "Growth";
      else if (s.includes("mystery") || s.includes("detective")) type = "Mystery";
      else if (s.includes("thriller")) type = "Thriller";
      else if (s.includes("horror")) type = "Horror";
      else if (s.includes("drama")) type = "Drama";
      else if (s.includes("adventure")) type = "Adventure";
      else if (s.includes("science fiction") || s.includes("sci-fi")) type = "Science Fiction";

      document.getElementById("bookType").innerHTML = type;

    })
    .catch(() => {
      document.getElementById("summary").innerHTML = "Summary unavailable.";
      document.getElementById("bookType").innerHTML = "Type unavailable.";
    });
}
</script>

</body>
</html>
