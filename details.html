<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body onload="loadDetails()">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Book Finder</a>
    <div>
      <a class="nav-link d-inline text-white" href="index.html" style="margin-right: 20px;">Home</a>
      <a class="nav-link d-inline text-white" href="profile.html" style="margin-right: 20px;">Profile</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <h1>Book Details</h1>

  <div id="detailsBox" class="mt-4"></div>

  

</div>


<script>
function loadDetails() {
  const params = new URLSearchParams(window.location.search);

  const title = params.get("title");
  const author = params.get("author");
  const year = params.get("year");
  const cover = params.get("cover");
  const workKey = params.get("work");

  const box = document.getElementById("detailsBox");

 box.innerHTML = `
  <div class="card p-4">
    <img src="${cover}" class="img-fluid mb-3" style="max-width:250px">
    <h3>${title}</h3>
    <p><strong>Author:</strong> ${author}</p>
    <p><strong>First Published:</strong> ${year}</p>
    <hr>

    <h5>Summary</h5>
    <p id="summary">Loading summary...</p>

    <h5 class="mt-3">Book Type</h5>
    <p id="bookType">Loading type...</p>

    <div class="d-flex gap-3 mt-4">
      <button class="btn btn-secondary flex-fill" onclick="history.back()">Back</button>
      <button class="btn btn-success flex-fill" onclick="addFavoriteFromDetails()">Add to Favorites</button>
    </div>

  </div>
`;

  // Save book info globally for the favorites button
  window.currentBook = { title, author, year, cover };

  // Fetch extra details
  fetch("https://openlibrary.org" + workKey + ".json")
    .then(r => r.json())
    .then(data => {
      let summaryText = "No summary available.";
      if (data.description) {
        summaryText = typeof data.description === "string"
          ? data.description
          : data.description.value;
      }
      document.getElementById("summary").innerHTML = summaryText;

      let subjects = data.subjects || [];
      let s = subjects.join(" ").toLowerCase();
      let type = "Unknown";

      if (s.includes("romance")) type = "Romantic";
      else if (s.includes("fantasy")) type = "Fantasy";
      else if (s.includes("mystery")) type = "Mystery";
      else if (s.includes("thriller")) type = "Thriller";
      else if (s.includes("horror")) type = "Horror";
      else if (s.includes("drama")) type = "Drama";
      else if (s.includes("adventure")) type = "Adventure";
      else if (s.includes("science fiction")) type = "Science Fiction";

      document.getElementById("bookType").innerHTML = type;
    })
    .catch(() => {
      document.getElementById("summary").innerHTML = "Summary unavailable.";
      document.getElementById("bookType").innerHTML = "Type unavailable.";
    });
}

// FAVORITES FROM DETAILS PAGE
function addFavoriteFromDetails() {
  let favs = JSON.parse(localStorage.getItem("favorites") || "[]");
  let book = window.currentBook;

  favs.push(book);
  localStorage.setItem("favorites", JSON.stringify(favs));

  alert("Book added to favorites!");
}
</script>

</body>
</html>
