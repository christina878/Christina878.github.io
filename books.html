<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book Search</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Search Books</h1>

    <div class="input-group mb-2">
      <input id="searchInput" class="form-control" placeholder="Search for a book (title, author, ISBN)">
      <button class="btn btn-success" onclick="searchBooks()">Search</button>
    </div>

    <div id="searchInfo" class="mb-2 text-muted"></div>
    <div id="searchResults" class="row gy-3"></div>

    <a href="profile.html" class="btn btn-secondary mt-4">Go to Profile</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
