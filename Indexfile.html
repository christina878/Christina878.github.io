<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library – Book Search</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f8f9fa; }
        .card img { height: 300px; object-fit: cover; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">Open Library • Search</a>
    </div>
</nav>

<div class="container">
    <h2 class="mb-3">Search for a Book</h2>

    <div class="row mb-3">
        <div class="col-md-8">
            <input id="searchInput" class="form-control" placeholder="Enter a book title or author...">
        </div>
        <div class="col-md-4">
            <button id="searchBtn" class="btn btn-primary w-100">Search</button>
        </div>
    </div>

    <p id="errorMsg" class="text-danger"></p>

    <div id="results" class="row g-3"></div>
</div>

<script src="js/search.js"></script>

</body>
</html>
